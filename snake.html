<!DOCTYPE html>

<html>
<head>
    <meta charset="UTF-8">
    <title>Snake Game</title>

    <style>
        body {
            background: #111;
            color: white;
            text-align: center;
            font-family: Arial;
        }

        canvas {
            background: black;
            border: 3px solid white;
        }

        h1 {
            color: lime;
        }
    </style>

</head>

<body>

<h1>🐍 Snake Game</h1>
<p>النقاط: <span id="score">0</span></p>

<canvas id="game" width="600" height="400"></canvas>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const size = 20;

let snake = [
    {x: 300, y: 200},
    {x: 280, y: 200},
    {x: 260, y: 200}
];

let dx = size;
let dy = 0;

let score = 0;

let food = createFood();

document.addEventListener("keydown", changeDirection);

function createFood() {
    return {
        x: Math.floor(Math.random() * (canvas.width / size)) * size,
        y: Math.floor(Math.random() * (canvas.height / size)) * size
    };
}

function changeDirection(event) {

    if (event.key === "ArrowUp" && dy === 0) {
        dx = 0;
        dy = -size;
    }

    if (event.key === "ArrowDown" && dy === 0) {
        dx = 0;
        dy = size;
    }

    if (event.key === "ArrowLeft" && dx === 0) {
        dx = -size;
        dy = 0;
    }

    if (event.key === "ArrowRight" && dx === 0) {
        dx = size;
        dy = 0;
    }
}

function gameLoop() {

    const head = {
        x: snake[0].x + dx,
        y: snake[0].y + dy
    };

    // الاصطدام بالجدار
    if (
        head.x < 0 ||
        head.x >= canvas.width ||
        head.y < 0 ||
        head.y >= canvas.height
    ) {
        gameOver();
        return;
    }

    // الاصطدام بنفسه
    for (let part of snake) {
        if (head.x === part.x && head.y === part.y) {
            gameOver();
            return;
        }
    }

    snake.unshift(head);

    // أكل الطعام
    if (head.x === food.x && head.y === food.y) {

        score++;

        document.getElementById("score").textContent = score;

        food = createFood();

    } else {
        snake.pop();
    }

    draw();

    setTimeout(gameLoop, 100);
}

function draw() {

    // الخلفية
    ctx.fillStyle = "black";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // الطعام
    ctx.fillStyle = "red";

    ctx.fillRect(
        food.x,
        food.y,
        size,
        size
    );

    // الثعبان
    ctx.fillStyle = "lime";

    for (let part of snake) {

        ctx.fillRect(
            part.x,
            part.y,
            size,
            size
        );
    }
}

function gameOver() {

    ctx.fillStyle = "white";
    ctx.font = "40px Arial";
    ctx.textAlign = "center";

    ctx.fillText(
        "GAME OVER",
        canvas.width / 2,
        canvas.height / 2
    );

    ctx.font = "20px Arial";

    ctx.fillText(
        "Refresh the page to play again",
        canvas.width / 2,
        canvas.height / 2 + 40
    );
}

draw();
gameLoop();

</script>

</body>
</html>
